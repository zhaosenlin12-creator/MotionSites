<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MotionSites recipe demo</title>
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#06070b}
  body{width:1280px;height:800px;overflow:hidden}
  .stage{position:relative;width:1280px;height:800px;overflow:hidden;
    background:#06070b;color:#f2f4f8;
    font:14px/1.5 "Inter","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  .mono{font-family:"JetBrains Mono","Consolas",monospace}
  .micro{font:500 11px/1 "JetBrains Mono","Consolas",monospace;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.46)}
  .dim{color:rgba(255,255,255,.52)}
  .bg{position:absolute;inset:0;z-index:0;pointer-events:none}
  .glow{position:absolute;border-radius:50%;filter:blur(80px);opacity:.5;z-index:0}
  .grid{position:absolute;inset:0;z-index:0;pointer-events:none;
    background-image:radial-gradient(rgba(255,255,255,.055) 1px,transparent 1px);background-size:26px 26px;
    mask-image:radial-gradient(120% 120% at 50% 20%,#000 30%,transparent 82%);
    -webkit-mask-image:radial-gradient(120% 120% at 50% 20%,#000 30%,transparent 82%)}
  .grain{position:absolute;inset:0;z-index:50;pointer-events:none;opacity:.05;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='.6'/></svg>")}
  .vig{position:absolute;inset:0;z-index:51;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(0,0,0,.55) 100%)}
  .content{position:absolute;inset:0;z-index:5}
  .chrome{position:absolute;inset:0;z-index:40;pointer-events:none;
    font-family:"JetBrains Mono","Consolas",monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase}
  .chrome .tl{position:absolute;left:34px;top:30px;display:flex;align-items:center;gap:11px;color:rgba(255,255,255,.62)}
  .chrome .idx{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:22px;padding:0 8px;
    border:1px solid rgba(255,255,255,.22);border-radius:6px;color:#fff;background:rgba(10,12,18,.6);font-size:10.5px}
  .chrome .kind{color:rgba(255,255,255,.42)}
  .chrome .tr{position:absolute;right:34px;top:30px;color:rgba(255,255,255,.38);text-align:right;line-height:1.7}
  .chrome .br{position:absolute;right:34px;bottom:26px;color:rgba(255,255,255,.3);text-align:right}
  .hairline{background:rgba(255,255,255,.09)}
  .card-surface{background:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.02));
    border:1px solid rgba(255,255,255,.11);border-radius:16px;
    box-shadow:0 24px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08)}
  .pill{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:99px;
    border:1px solid rgba(255,255,255,.16);font:500 12px/1 "Inter",sans-serif;color:rgba(255,255,255,.8)}
  .dotline{height:1px;flex:1;background:linear-gradient(90deg,rgba(255,255,255,.22),rgba(255,255,255,0))}
  @keyframes drift{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(3%,-4%,0) scale(1.08)}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes scanY{0%{top:-2%}100%{top:102%}}
  @keyframes dash{to{stroke-dashoffset:-240}}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  @keyframes breathe{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(1.06);opacity:.9}}
  @keyframes marquee{to{transform:translateX(-50%)}}
  @keyframes sheen{0%{transform:translateX(-120%) rotate(18deg)}100%{transform:translateX(240%) rotate(18deg)}}
  @keyframes blink{0%,45%{opacity:1}50%,95%{opacity:.15}100%{opacity:1}}
  @keyframes tilt{0%,100%{transform:rotateY(-16deg) rotateX(9deg)}50%{transform:rotateY(12deg) rotateX(-6deg)}}
  @keyframes rise{0%{transform:translateY(26px);opacity:0}18%,86%{transform:translateY(0);opacity:1}100%{transform:translateY(0);opacity:1}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="bg" id="bg"></div>
  <div class="content" id="content"></div>
  <div class="chrome" id="chrome"></div>
  <div class="grain"></div>
  <div class="vig"></div>
</div>
<script src="recipe_demo.js"></script>
</body>
</html>
