<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="Inter,system-ui,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07080c"/>
      <stop offset="1" stop-color="#0c0f17"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b9cff"/>
      <stop offset=".5" stop-color="#b48cff"/>
      <stop offset="1" stop-color="#5cdcb1"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#9aacff" stop-opacity=".4"/>
      <stop offset="1" stop-color="#9aacff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#glow)"/>

  <!-- search active state -->
  <rect x="40" y="40" width="720" height="48" rx="12" fill="rgba(16,20,29,.78)" stroke="#9aacff" stroke-width="1.5"/>
  <text x="64" y="70" fill="#f1f3f7" font-size="14">aur</text>
  <rect x="100" y="56" width="2" height="20" fill="#9aacff">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <text x="40" y="120" fill="#8d99af" font-size="12">Best match highlighted with a soft glow &middot; 4 cards in this view</text>

  <g transform="translate(40,150)">
    <!-- matched card with glow -->
    <rect x="-6" y="-6" width="262" height="182" rx="20" fill="url(#aurora)" opacity=".25"/>
    <rect width="250" height="170" rx="14" fill="#10141d" stroke="#9aacff" stroke-width="1.5"/>
    <rect width="250" height="110" rx="14" fill="url(#aurora)" opacity=".5"/>
    <text x="14" y="138" fill="#f1f3f7" font-size="14" font-weight="700">Aurora &mdash; animated gradient</text>
    <text x="14" y="156" fill="#8d99af" font-size="11">Landing Page &middot; hero &middot; open</text>

    <g transform="translate(270,0)">
      <rect width="250" height="170" rx="14" fill="#10141d" stroke="#232a37"/>
      <rect width="250" height="110" rx="14" fill="#0c0f17"/>
      <text x="14" y="138" fill="#f1f3f7" font-size="14" font-weight="600">Aura analytics dashboard</text>
      <text x="14" y="156" fill="#8d99af" font-size="11">Dashboard &middot; open</text>
    </g>

    <g transform="translate(540,0)">
      <rect width="220" height="170" rx="14" fill="#10141d" stroke="#232a37"/>
      <rect width="220" height="110" rx="14" fill="#0c0f17"/>
      <text x="14" y="138" fill="#f1f3f7" font-size="14" font-weight="600">Aura mobile shell</text>
      <text x="14" y="156" fill="#8d99af" font-size="11">Mobile &middot; open</text>
    </g>
  </g>

  <g transform="translate(40,360)" font-size="12" fill="#8d99af">
    <rect width="280" height="100" rx="12" fill="rgba(255,255,255,.03)" stroke="#232a37"/>
    <text x="14" y="24" fill="#5cdcb1" font-weight="600">TIP</text>
    <text x="14" y="48" fill="#f1f3f7">Press <tspan font-family="JetBrains Mono,monospace" fill="#9aacff">/</tspan> to focus search</text>
    <text x="14" y="68">Press <tspan font-family="JetBrains Mono,monospace" fill="#9aacff">Esc</tspan> to clear &middot; <tspan font-family="JetBrains Mono,monospace" fill="#9aacff">G</tspan> to toggle compact mode</text>
  </g>
  <g transform="translate(340,360)" font-size="12" fill="#8d99af">
    <rect width="420" height="100" rx="12" fill="rgba(255,255,255,.03)" stroke="#232a37"/>
    <text x="14" y="24" fill="#ffba72" font-weight="600">SPOTLIGHT</text>
    <text x="14" y="48" fill="#f1f3f7">Best match glows with a soft radial gradient.</text>
    <text x="14" y="68">Query <tspan font-family="JetBrains Mono,monospace" fill="#9aacff">aur</tspan> &rarr; 3 results, top card highlighted.</text>
  </g>
</svg>
