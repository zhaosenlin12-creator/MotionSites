<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" font-family="Inter,system-ui,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07080c"/>
      <stop offset="1" stop-color="#0c0f17"/>
    </linearGradient>
  </defs>
  <rect width="800" height="360" fill="url(#bg)"/>

  <text x="40" y="40" fill="#f1f3f7" font-size="20" font-weight="700">Multi-dimensional filters</text>
  <text x="40" y="62" fill="#8d99af" font-size="12">Stack filters · live counter · keyboard-friendly</text>

  <g transform="translate(40,90)">
    <text fill="#8d99af" font-size="11" letter-spacing="1">CATEGORY</text>
    <rect y="14" width="240" height="40" rx="10" fill="rgba(16,20,29,.78)" stroke="#232a37"/>
    <text x="14" y="40" fill="#f1f3f7" font-size="13">Landing Page · Hero · SaaS</text>

    <text x="280" fill="#8d99af" font-size="11" letter-spacing="1">TYPE</text>
    <rect x="280" y="14" width="200" height="40" rx="10" fill="rgba(16,20,29,.78)" stroke="#232a37"/>
    <text x="294" y="40" fill="#f1f3f7" font-size="13">hero · full-page</text>

    <text x="520" fill="#8d99af" font-size="11" letter-spacing="1">ACCESS</text>
    <rect x="520" y="14" width="200" height="40" rx="10" fill="rgba(16,20,29,.78)" stroke="#232a37"/>
    <text x="534" y="40" fill="#f1f3f7" font-size="13">open · premium</text>

    <text y="84" fill="#8d99af" font-size="11" letter-spacing="1">MEDIA</text>
    <rect y="98" width="240" height="40" rx="10" fill="rgba(16,20,29,.78)" stroke="#232a37"/>
    <text x="14" y="124" fill="#f1f3f7" font-size="13">webp · mp4 · none</text>

    <text x="280" y="84" fill="#8d99af" font-size="11" letter-spacing="1">DENSITY</text>
    <rect x="280" y="98" width="200" height="40" rx="10" fill="rgba(16,20,29,.78)" stroke="#232a37"/>
    <text x="294" y="124" fill="#f1f3f7" font-size="13">grid (16:10) · compact</text>

    <text x="520" y="84" fill="#8d99af" font-size="11" letter-spacing="1">SORT</text>
    <rect x="520" y="98" width="200" height="40" rx="10" fill="rgba(16,20,29,.78)" stroke="#232a37"/>
    <text x="534" y="124" fill="#f1f3f7" font-size="13">popular · new · a-z</text>

    <text y="168" fill="#8d99af" font-size="11" letter-spacing="1">SEARCH</text>
    <rect y="182" width="720" height="40" rx="10" fill="rgba(16,20,29,.78)" stroke="#232a37"/>
    <text x="14" y="208" fill="#5f6a82" font-size="13">/ focus · type to filter · Esc clears</text>
  </g>

  <g transform="translate(40,300)" font-size="11" fill="#8d99af">
    <text>Showing</text>
    <text x="50" fill="#9aacff" font-weight="700">128</text>
    <text x="74">of 364 prompts ·</text>
    <text x="190" fill="#5cdcb1">3 active filters</text>
  </g>
</svg>
